apiVersion: apps/v1
kind: Deployment
metadata:
  name: mast-maggan-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mast-maggan-app
  template:
    metadata:
      labels:
        app: mast-maggan-app
    spec:
      containers:
      - name: mast-maggan-app
        image: mast-maggan-app-web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://root:rootpassword@mysql-svc:3306/mastmaggan_db"
