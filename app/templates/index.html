<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mast Maggan - Red & Black Playlist</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .logo {
            font-size: 38px;
            font-weight: 800;
            color: #ff0033;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 0, 51, 0.6);
        }
        .subtitle { color: #888888; font-size: 14px; margin-top: 5px; }
        .container {
            background: #141414;
            border: 1px solid #262626;
            border-top: 4px solid #ff0033;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(255, 0, 51, 0.15);
            width: 100%;
            max-width: 600px;
        }
        .player-box {
            background: #1a1a1a;
            border: 1px solid #ff0033;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.2);
        }
        .now-playing-title { font-size: 20px; font-weight: bold; color: #fff; }
        .now-playing-artist { color: #ff3355; font-size: 14px; margin-bottom: 15px; }
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg); }
        .playlist-title { font-size: 16px; font-weight: bold; color: #888; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .song-item {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .song-item:hover {
            border-color: #ff0033;
            background: #251215;
        }
        .song-info { display: flex; flex-direction: column; }
        .song-name { font-weight: 600; font-size: 16px; color: #fff; }
        .song-sub { font-size: 12px; color: #888; }
        .play-btn {
            background: #ff0033;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
	    <div class="logo">Mast Maggan</div>
        <p class="subtitle">DevSecOps Streaming Platform • Multi-Track Edition</p>
    </div>

    <div class="container">
        <!-- Main Player -->
        <div class="player-box">
            <div class="now-playing-title" id="current-title">Select a Song</div>
            <div class="now-playing-artist" id="current-artist">Click any track from playlist</div>
            <audio id="audio-player" controls>
                <source id="audio-source" src="" type="audio/mpeg">
            </audio>
        </div>

        <!-- Playlist -->
        <div class="playlist-title">🎵 Available Songs</div>
        <div id="playlist">
            {% for song in songs %}
            <div class="song-item" onclick="playSong('{{ song.id }}', '{{ song.title }}', '{{ song.artist }}')">
                <div class="song-info">
                    <span class="song-name">{{ song.title }}</span>
                    <span class="song-sub">by {{ song.artist }}</span>
                </div>
                <button class="play-btn">PLAY</button>
            </div>
            {% else %}
            <p style="color: #888; text-align: center;">No songs available.</p>
            {% endfor %}
        </div>
    </div>

    <script>
        function playSong(id, title, artist) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-artist').innerText = "by " + artist;
            var player = document.getElementById('audio-player');
            var source = document.getElementById('audio-source');
            source.src = "/stream/" + id;
            player.load();
            player.play();
        }
    </script>
</body>
</html>
