apiVersion: apps/v1
kind: Deployment
metadata:
  name: mast-maggan-app
  labels:
    app: mast-maggan-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mast-maggan-app
  template:
    metadata:
      labels:
        app: mast-maggan-app
    spec:
      containers:
      - name: mast-maggan-app
        image: mast-maggan-app-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://root:rootpassword@mysql-svc:3306/mastmaggan_db"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
