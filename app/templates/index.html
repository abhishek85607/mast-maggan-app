<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mast Maggan - Red & Black Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(circle at 50% 0%, #200507 0%, #0a0a0a 80%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .logo {
            font-size: 38px;
            font-weight: 800;
            color: #ff0033;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.7);
        }
        .subtitle { color: #888888; font-size: 13px; margin-top: 5px; letter-spacing: 1px; }

        .container {
            background: #141414;
            border: 1px solid #262626;
            border-top: 4px solid #ff0033;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(255, 0, 51, 0.18);
            width: 100%;
            max-width: 550px;
        }

        /* Red & Black Player Box */
        .player-box {
            background: #1a1a1a;
            border: 1px solid #ff0033;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.25);
        }
        .now-playing-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .now-playing-artist { color: #ff3355; font-size: 14px; margin-bottom: 16px; font-weight: 600; }

        /* Dynamic Red Visualizer Beats */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 46px;
            margin-bottom: 18px;
        }
        .bar {
            width: 5px;
            height: 4px;
            background: linear-gradient(to top, #660011, #ff0033, #ff6680);
            border-radius: 3px;
            transition: height 0.08s ease;
            box-shadow: 0 0 8px rgba(255, 0, 51, 0.5);
        }

        /* Custom Seek Bar Line */
        .seek-container { margin-bottom: 16px; }
        .seek-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #2b2b2b;
            outline: none;
            cursor: pointer;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ff0033;
            box-shadow: 0 0 12px #ff0033;
            cursor: pointer;
        }
        .time-box {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Play / Pause Toggle Button */
        .controls { display: flex; justify-content: center; align-items: center; }
        .btn-toggle {
            background: linear-gradient(135deg, #ff0033, #cc0029);
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-toggle:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 0, 51, 0.7); }

        /* Playlist Section */
        .playlist-title { font-size: 15px; font-weight: 700; color: #888; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .playlist-scroll { max-height: 240px; overflow-y: auto; padding-right: 4px; }
        .playlist-scroll::-webkit-scrollbar { width: 4px; }
        .playlist-scroll::-webkit-scrollbar-thumb { background: #ff0033; border-radius: 4px; }

        .song-item {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .song-item:hover {
            border-color: #ff0033;
            background: #251215;
            transform: translateX(4px);
        }
        .song-info { display: flex; flex-direction: column; }
        .song-name { font-weight: 600; font-size: 15px; color: #fff; }
        .song-sub { font-size: 12px; color: #888; }
        .play-btn {
            background: #ff0033;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Mast Maggan</div>
	<div class="by-author">by Abhishek</div>
        <p class="subtitle">DevSecOps Streaming Platform • Multi-Track Edition</p>
    </div>

    <div class="container">
        <!-- Main Player -->
        <div class="player-box">
            <div class="now-playing-title" id="current-title">Select a Song</div>
            <div class="now-playing-artist" id="current-artist">Click any track from playlist</div>

            <!-- Dynamic Equalizer Beats -->
            <div class="visualizer" id="visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div>
            </div>

            <!-- Smooth Seek Bar -->
            <div class="seek-container">
                <input type="range" class="seek-bar" id="seek-bar" value="0" min="0" max="100">
                <div class="time-box">
                    <span id="current-time">0:00</span>
                    <span id="duration-time">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-toggle" id="btn-toggle" onclick="togglePlay()">PLAY</button>
            </div>

            <audio id="audio-player" crossorigin="anonymous"></audio>
        </div>

        <!-- Playlist -->
        <div class="playlist-title">🎵 Available Songs</div>
        <div class="playlist-scroll" id="playlist">
            {% for song in songs %}
            <div class="song-item" onclick="playSong('{{ song.id }}', '{{ song.title }}', '{{ song.artist }}')">
                <div class="song-info">
                    <span class="song-name">{{ song.title }}</span>
                    <span class="song-sub">by {{ song.artist }}</span>
                </div>
                <button class="play-btn">PLAY</button>
            </div>
            {% else %}
            <p style="color: #888; text-align: center;">No songs available.</p>
            {% endfor %}
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const seekBar = document.getElementById('seek-bar');
        const currTimeEl = document.getElementById('current-time');
        const durTimeEl = document.getElementById('duration-time');
        const btnToggle = document.getElementById('btn-toggle');
        const bars = document.querySelectorAll('.bar');

        let isSeeking = false;
        let audioCtx, analyser, dataArray, sourceNode;

        function formatTime(s) {
            if (isNaN(s)) return "0:00";
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function initVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function renderBeats() {
            if (!audio.paused && analyser) {
                analyser.getByteFrequencyData(dataArray);
                bars.forEach((bar, i) => {
                    const val = dataArray[i % dataArray.length] || 0;
                    const h = Math.max(4, Math.min(46, (val / 255) * 46));
                    bar.style.height = h + 'px';
                });
                requestAnimationFrame(renderBeats);
            } else {
                bars.forEach(b => b.style.height = '4px');
            }
        }

        function playSong(id, title, artist) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-artist').innerText = "by " + artist;
            audio.src = "/stream/" + id;

            try { initVisualizer(); } catch(e){}

            audio.play().then(() => {
                btnToggle.innerText = "PAUSE";
                renderBeats();
            }).catch(e => console.log('Autoplay warning:', e));
        }

        function togglePlay() {
            if (!audio.src) return;
            try { initVisualizer(); } catch(e){}

            if (audio.paused) {
                audio.play();
                btnToggle.innerText = "PAUSE";
                renderBeats();
            } else {
                audio.pause();
                btnToggle.innerText = "PLAY";
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (!isSeeking && audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekBar.value = progress;
                currTimeEl.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durTimeEl.innerText = formatTime(audio.duration);
        });

        // Seek Bar Dragging & Clicking
        seekBar.addEventListener('input', () => { isSeeking = true; });
        seekBar.addEventListener('change', () => {
            if (audio.duration) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
            }
            isSeeking = false;
        });
    </script>
</body>
</html>
